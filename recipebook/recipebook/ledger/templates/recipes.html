<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Ingredients</title>
    </head>
    <body>

        <ol>
            {% for recipe in name %}
            <li> {{ recipe }} </li>

            <ul>
                {% for ingredient in ingredients %}
                {% for quantity in quantities %}
                <li>{{ ingredient }}: {{quantity}}</li>
                
            </ul>

            {% endfor %}
        </ol>
        
    </body>
</html>
